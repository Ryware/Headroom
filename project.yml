# Generate the Xcode project for App Store builds: `xcodegen` → Headroom.xcodeproj
# The Swift package (Package.swift + build.sh) remains the path for direct-download builds.
name: Headroom
options:
  bundleIdPrefix: dev.ryware
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
targets:
  Headroom:
    type: application
    platform: macOS
    sources:
      - Sources/Headroom
      - Assets/Assets.xcassets
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_NAME: Headroom
        PRODUCT_BUNDLE_IDENTIFIER: dev.ryware.disktree
        MARKETING_VERSION: "1.0.5"
        CURRENT_PROJECT_VERSION: "8"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AppStore.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        # Use the hand-maintained Info.plist rather than a generated one.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) APP_STORE"
